[project]
name = "fetch-ladder"
version = "0.1.0"
description = "Fetch a URL up a ladder of clients with shared manners."
readme = "README.md"
authors = [
    { name = "jsnyde0", email = "jonatansnyders@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.3",
    "httpx>=0.28.1",
]

[project.scripts]
fetch-ladder = "fetch_ladder.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
